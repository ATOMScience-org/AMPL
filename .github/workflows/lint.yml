name: linter

on: [push]

jobs:
  ruff:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
      - name: Update apt cache
        run: |
          sudo apt-get update || sudo apt-get update --fix-missing

      - name: System Dependencies
        run: |
          sudo apt install -y build-essential \
            libcairo2-dev \
            pkg-config \
            python3-dev \
            python3-openssl
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          python -m pip install --upgrade uv
          uv --version

      - name: Cache uv downloads
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('pip/*.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Create venv
        run: |
          uv venv .venv

      - name: Install dependencies
        run: |
          . .venv/bin/activate
          if [ -f pip/cpu_requirements.txt ]; then pip install -r pip/cpu_requirements.txt; fi
          uv pip install ruff

      - name: Lint with ruff
        run: |
          # Check all lint rules
          . .venv/bin/activate
          uv run ruff check atomsci/

