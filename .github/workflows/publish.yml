name: Publish Python Package

# publish atomsci-ampl to pypi
#
# Owner	          -> ATOMScience-org
# Repository name -> AMPL
# Project         -> atomsci-ampl
#
# The workflow:
#
# * build
# 
# * For testing:
#    
#    manual run → TestPyPI only
#
# Note: For version name, once it's used, it can't be reused. For test version, try
# these naming convesions:
#
# dev release	1.2.3.dev1
#
# * Tag push → TestPyPI then PyPI
#
# to trigger the tag push:
#
#   git tag v1.0.0
#   git push origin v1.0.0
#
#
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────
  # Job 1: Build the distribution package
  # ─────────────────────────────────────────
  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build sdist and wheel
        run: uv build

      - name: Upload dist as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

    # ─────────────────────────────────────────
    # Job 2: Publish to TestPyPI first
    # ─────────────────────────────────────────
    publish-test:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    environment: testpypi

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }} # defined in environment `testpypi`

  
    # ─────────────────────────────────────────
    # Job 3: Publish to real PyPI
    #   - requires manual approval if you set up
    #     a "pypi" environment with protection rules
    # ─────────────────────────────────────────
    publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: publish-test
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}   # defined in environment `pypi`
