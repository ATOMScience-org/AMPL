name: "python-uv-setup"
description: "Common Python + uv setup, deps install, and optional debug"

inputs:
  python-version:
    description: "Python version"
    required: true
  debug:
    description: "Enable debug output"
    required: false
    default: "false"
  lockfile:
    description: "Lockfile to use"
    required: false
    default: "uv.lock.cpu"
  extras:
    description: "Extra dependency set to install"
    required: false
    default: "cpu"
  dependency-groups:
    description: "Dependency group to install"
    required: false
    default: "dev"

runs:
  using: "composite"
  steps:
    - name: System Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libcairo2-dev \
          pkg-config \
          python3-dev \
          python3-openssl \
          libopenblas-dev \
          libssl-dev

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      shell: bash
      run: |
        python -m pip install --upgrade uv
        uv --version

    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-py${{ inputs.python-version }}-uv-${{ hashFiles('pyproject.toml', 'uv.lock.cpu') }}
        restore-keys: |
          ${{ runner.os }}-py${{ inputs.python-version }}-uv-

    - name: Install dependencies
      shell: bash
      run: |
        set -euxo pipefail
        cp "${{ inputs.lockfile }}" uv.lock
        uv venv .venv
        . .venv/bin/activate
        uv sync --extra "${{ inputs.extras }}" --group "${{ inputs.dependency-groups }}" --locked

    - name: Debug - what is installed
      if: ${{ inputs.debug == 'true' }}
      shell: bash
      run: |
        . .venv/bin/activate
        uv pip list
