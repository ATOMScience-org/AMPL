name: "python-uv-setup"
description: "Common Python + uv setup, deps install, and optional debug"
inputs:
  python-version:
    description: "Python version"
    required: true
  debug:
    description: "Enable debug output"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: System Dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libcairo2-dev \
          pkg-config \
          python3-dev \
          python3-openssl \
          libopenblas-dev \
          libssl-dev

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install uv
      shell: bash
      run: |
        python -m pip install --upgrade uv
        uv --version

    - name: Cache uv dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ hashFiles('pip/*.txt') }}
        restore-keys: |
          ${{ runner.os }}-uv-

    - name: Create virtual environment
      shell: bash
      run: |
        uv venv --seed .venv

    - name: Install dependencies
      shell: bash
      run: |
        . .venv/bin/activate
        uv pip install -e .
        if [ -f pip/cpu_requirements.txt ]; then uv pip install -r pip/cpu_requirements.txt; fi
        if [ -f pip/dev_requirements.txt ]; then uv pip install -r pip/dev_requirements.txt; fi

        # ensure pkg_resources exists for hyperopt
        uv pip install -U setuptools wheel
        python -c "import pkg_resources; print('pkg_resources OK')" || true

    - name: Debug - what is installed
      if: ${{ inputs.debug == 'true' }}
      shell: bash
      run: |
        . .venv/bin/activate
        python -m pip --version
        python -V
        uv --version
        uv pip list